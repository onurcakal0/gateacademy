<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2170"/>
      <stop offset="100%" stop-color="#050C26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#AEFF03" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Dark Rounded Container with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#gateGrad)" stroke="rgba(174, 255, 3, 0.45)" stroke-width="2"/>
  
  <!-- Outer Gate (Neon Green #AEFF03) -->
  <path d="M16 16 L34 16 L34 22 L22 22 L22 42 L34 42 L34 48 L16 48 Z" fill="#AEFF03" filter="url(#glow)"/>
  
  <!-- Inner Gate (Cyber Yellow #FFCD01 / White #FFFFFF) -->
  <path d="M30 22 L48 22 L48 42 L36 42 L36 36 L42 36 L42 28 L30 28 Z" fill="#FFCD01"/>
</svg>