<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B5E"/>
      <stop offset="100%" stop-color="#060F38"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#AEFF03" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <!-- Overlapping Frames (Gate Academy Symbol) -->
  <g transform="translate(16.29, 10) scale(0.2245)">
    <!-- Green Frame -->
    <path fill-rule="evenodd" d="M 0,32 L 105,0 L 105,149 L 0,181 Z M 14,50 L 91,26 L 91,131 L 14,155 Z" fill="#AEFF03" filter="url(#glow)"/>
    <!-- White Frame -->
    <path fill-rule="evenodd" d="M 35,47 L 140,15 L 140,164 L 35,196 Z M 49,65 L 126,41 L 126,146 L 49,170 Z" fill="#FFFFFF"/>
  </g>
</svg>